// ── FILE UPLOAD COMPONENT ─────────────────────
function FileUpload({ label, accept, multiple, file, files, onChange }) {
  const [previews, setPreviews] = useState([]);
  const [dragging, setDragging] = useState(false);
  const inputRef = useRef(null);

  const handleFileSelect = (e) => {
    const selected = e.target.files;
    if (!selected.length) return;
    if (multiple) { onChange(Array.from(selected)); }
    else { onChange(selected[0]); }
  };

  useEffect(() => {
    const fileList = multiple ? files : (file ? [file] : []);
    if (fileList && fileList.length) {
      Promise.all(fileList.map(f => new Promise(res => {
        const reader = new FileReader();
        reader.onload = e => res(e.target.result);
        reader.readAsDataURL(f);
      }))).then(setPreviews);
    } else { setPreviews([]); }
  }, [file, files, multiple]);

  return React.createElement("div", {style:{marginBottom:'0.75rem'}},
    React.createElement("label", {style:{fontSize:'0.8rem',fontWeight:600,marginBottom:6,display:'block'}}, label),
    React.createElement("div", {
      className:`upload-area ${dragging?'dragging':''}`,
      onDragOver:e=>{e.preventDefault();setDragging(true)},
      onDragLeave:()=>setDragging(false),
      onDrop:e=>{e.preventDefault();setDragging(false); const dt = e.dataTransfer; if(dt.files.length) { if(multiple) onChange(Array.from(dt.files)); else onChange(dt.files[0]); }},
      onClick:()=>inputRef.current.click()
    },
      React.createElement("input", {ref:inputRef, type:"file", accept, multiple, onChange:handleFileSelect, style:{display:'none'}}),
      previews.length ? React.createElement("div", {className:"upload-preview", style:{justifyContent:'center'}},
        previews.map((src,i) => React.createElement("img", {key:i, src, alt:""}))
      ) : React.createElement("div", {style:{color:C.muted,fontSize:'0.8rem'}}, "\ud83d\udcc1 Drag & drop or tap to upload")
    )
  );
}

    React.createElement("div", {className:"moats-grid", style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0.75rem',marginBottom:'1.5rem'}},
      [{t:"Proprietary Data Moat",d:"Years of African SME behavioural data. Competitors cannot buy this.",c:C.gold},
       {t:"Network Effects",d:"More SMEs attract more lenders. The flywheel is self-reinforcing.",c:C.green},
       {t:"Switching Costs",d:"A business's Credo history is their most valuable asset.",c:C.blue},
       {t:"API Lock-In",d:"Deep integrations create distribution channels.",c:C.gold}].map(m =>
        React.createElement("div", {key:m.t, className:"card", style:{borderTop:`3px solid ${m.c}`}},
          React.createElement("div", {style:{fontWeight:700,marginBottom:3,display:'flex',alignItems:'center',gap:3,fontSize:'0.78rem'}},
            React.createElement("span", {style:{color:m.c}}, "\u25C6"), m.t
          ),
          React.createElement("div", {style:{fontSize:'0.7rem',color:C.muted,lineHeight:1.5}}, m.d)
        )
      )
    ),
    React.createElement("div", {className:"card", style:{textAlign:'center'}},
      React.createElement("h3", {style:{fontFamily:'var(--font-heading)',fontSize:'1.1rem'}}, "We are raising R1M seed at R5M pre-money"),
      React.createElement("p", {style:{fontSize:'0.78rem',color:C.muted,margin:'0.4rem 0 0.75rem'}}, "To onboard 500 vendors, build lender integrations, and refine the trust engine."),
      React.createElement("a", {href:"mailto:investors@credo.africa", style:{display:'inline-block',background:C.green,color:'#000',padding:'10px 22px',borderRadius:7,fontWeight:700,fontSize:'0.82rem',textDecoration:'none'}}, "Download Investor Deck →")
    )
  );
}

// ── ADMIN APP ────────────────────────────────
function AdminApp() {
  const [adminView, setAdminView] = useState("Dashboard");
  return React.createElement("div", {style:{paddingTop:68}},
    React.createElement("nav", null,
      React.createElement("div", {style:{display:'flex',alignItems:'center',gap:8}},
        React.createElement(CredoLogo, {size:26}),
        React.createElement("span", {style:{fontSize:'0.65rem',color:C.muted,letterSpacing:'0.06em'}}, "ADMIN")
      ),
      React.createElement("div", {style:{display:'flex',gap:3}},
        ["Dashboard","Credit Engine","Investors"].map(t =>
          React.createElement("button", {key:t, onClick:()=>setAdminView(t), style:{background:adminView===t?C.surface2:'transparent',border:adminView===t?`1px solid ${C.border}`:'1px solid transparent',color:adminView===t?C.green:C.muted,padding:'5px 12px',borderRadius:5,cursor:'pointer',fontSize:'0.7rem',fontWeight:500}}, t)
        )
      ),
      React.createElement("button", {onClick:logoutAdmin, style:{background:C.red,color:'#fff',border:'none',padding:'5px 12px',borderRadius:5,cursor:'pointer',fontSize:'0.65rem'}}, "Logout")
    ),
    adminView === "Dashboard" && React.createElement(AdminDashboard),
    adminView === "Credit Engine" && React.createElement(CreditEngine),
    adminView === "Investors" && React.createElement(Investors)
  );
}

// ── ROOT APP ──────────────────────────────────
function App() {
  const [admin, setAdmin] = useState(isAdmin());
  const [showPin, setShowPin] = useState(false);
  const [pinInput, setPinInput] = useState("");
  const [pinError, setPinError] = useState(false);
  const [onboarding, setOnboarding] = useState(false);

  const handleLogin = () => {
    if (loginAdmin(pinInput)) {
      setAdmin(true);
      setShowPin(false);
      setPinError(false);
    } else {
      setPinError(true);
    }
  };

  if (onboarding) return React.createElement(VendorOnboarding, {onBackToLanding:()=>setOnboarding(false)});

  if (!admin && !showPin) {
    return React.createElement("div", null,
      React.createElement(PublicLanding, {onStartOnboarding:()=>setOnboarding(true)}),
      React.createElement("div", {style:{position:'fixed',bottom:8,right:8,opacity:0.3,zIndex:9999}},
        React.createElement("a", {onClick:()=>setShowPin(true), style:{color:C.muted,fontSize:'0.6rem',cursor:'pointer',textDecoration:'none'}}, "admin")
      )
    );
  }

  if (!admin && showPin) {
    return React.createElement("div", {style:{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:'0.75rem',background:C.bg}},
      React.createElement(CredoLogo, {size:32}),
      React.createElement("input", {type:"password", placeholder:"Enter PIN", value:pinInput, onChange:e=>setPinInput(e.target.value), onKeyDown:e=>e.key==='Enter'&&handleLogin(), style:{background:C.surface2,border:`1px solid ${C.border}`,color:C.text,padding:'7px 14px',borderRadius:6,fontSize:'0.85rem',width:180,textAlign:'center',outline:'none'}}),
      React.createElement("button", {onClick:handleLogin, style:{background:C.green,color:'#000',border:'none',padding:'7px 20px',borderRadius:6,fontWeight:700,cursor:'pointer',fontSize:'0.82rem'}}, "Log in"),
      pinError && React.createElement("div", {style:{color:C.red,fontSize:'0.7rem'}}, "Incorrect PIN"),
      React.createElement("button", {onClick:()=>{setShowPin(false);setPinInput('');setPinError(false)}, style:{background:'transparent',color:C.muted,border:'none',cursor:'pointer',fontSize:'0.7rem'}}, "Back to site")
    );
  }

  return React.createElement(AdminApp);
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
console.log("Credo app mounted");
</script>
</body>
</html>
