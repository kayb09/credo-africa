// Onboarding components (unchanged logic, but using React.createElement)
function FileUpload({ label, accept, multiple, file, files, onChange }) {
  const [previews, setPreviews] = useState([]);
  const [dragging, setDragging] = useState(false);
  const inputRef = useRef(null);

  const handleFileSelect = (e) => {
    const selected = e.target.files;
    if (!selected.length) return;
    if (multiple) {
      onChange(Array.from(selected));
    } else {
      onChange(selected[0]);
    }
  };

  useEffect(() => {
    const fileList = multiple ? files : (file ? [file] : []);
    if (fileList && fileList.length) {
      Promise.all(fileList.map(f => new Promise(res => {
        const reader = new FileReader();
        reader.onload = e => res(e.target.result);
        reader.readAsDataURL(f);
      }))).then(setPreviews);
    } else {
      setPreviews([]);
    }
  }, [file, files, multiple]);

  return React.createElement("div", { style:{marginBottom:'1rem'} },
    React.createElement("label", { style:{fontSize:13,fontWeight:600,marginBottom:8,display:'block'} }, label),
    React.createElement("div", {
      className:`upload-area ${dragging?'dragging':''}`,
      onDragOver:e=>{e.preventDefault();setDragging(true)},
      onDragLeave:()=>setDragging(false),
      onDrop:e=>{e.preventDefault();setDragging(false); const dt = e.dataTransfer; if(dt.files.length) { if(multiple) onChange(Array.from(dt.files)); else onChange(dt.files[0]); }},
      onClick:()=>inputRef.current.click()
    },
      React.createElement("input", { ref:inputRef, type:"file", accept, multiple, onChange:handleFileSelect, style:{display:'none'} }),
      previews.length ? 
        React.createElement("div", { className:"upload-preview", style:{justifyContent:'center'} },

        ) :
        React.createElement("div", { style:{color:C.muted} }, "📁 Drag & drop or tap to upload")
    )
  );
}

  const [admin, setAdmin] = useState(isAdmin());
  const [showPin, setShowPin] = useState(false);
  const [pinInput, setPinInput] = useState("");
  const [pinError, setPinError] = useState(false);
  const [onboarding, setOnboarding] = useState(false);

  const handleLogin = () => {
    if (loginAdmin(pinInput)) {
      setAdmin(true);
      setShowPin(false);
      setPinError(false);
    } else {
      setPinError(true);
    }
  };

  if (onboarding) {
    return React.createElement(VendorOnboarding, { onBackToLanding:()=>setOnboarding(false) });
  }

  if (!admin && !showPin) {
    return React.createElement("div", null,
      React.createElement(PublicLanding, { onStartOnboarding:()=>setOnboarding(true) }),
      React.createElement("div", { style:{position:'fixed',bottom:10,right:10,opacity:0.3,zIndex:9999} },
        React.createElement("a", { onClick:()=>setShowPin(true), style:{color:C.muted,fontSize:10,cursor:'pointer',textDecoration:'none'} }, "admin")
      )
    );
  }

  if (!admin && showPin) {
    return React.createElement("div", { style:{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:'1rem',background:C.bg} },
      React.createElement(CredoLogo, { size:36 }),
      React.createElement("input", { type:"password", placeholder:"Enter PIN", value:pinInput, onChange:e=>setPinInput(e.target.value), onKeyDown:e=>e.key==='Enter'&&handleLogin(), style:{background:C.surface2,border:`1px solid ${C.border}`,color:C.text,padding:'8px 16px',borderRadius:8,fontSize:15,width:200,textAlign:'center',outline:'none'} }),
      React.createElement("button", { onClick:handleLogin, style:{background:C.green,color:'#000',border:'none',padding:'8px 24px',borderRadius:8,fontWeight:700,cursor:'pointer'} }, "Log in"),
      pinError && React.createElement("div", { style:{color:C.red,fontSize:12} }, "Incorrect PIN"),
      React.createElement("button", { onClick:()=>{setShowPin(false);setPinInput('');setPinError(false)}, style:{background:'transparent',color:C.muted,border:'none',cursor:'pointer',fontSize:12} }, "Back to site")
    );
  }

  return React.createElement(AdminApp);
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
console.log("Credo app mounted successfully");
</script>
</body>
</html>
