// ── NEW ONBOARDING COMPONENTS ────────────
function FileUpload({ label, accept, multiple, file, files, onChange }) {
  const [previews, setPreviews] = useState([]);
  const [dragging, setDragging] = useState(false);
  const inputRef = useRef(null);

  const handleFileSelect = (e) => {
    const selected = e.target.files;
    if (!selected.length) return;
    if (multiple) {
      onChange(Array.from(selected));
    } else {
      onChange(selected[0]);
    }
  };

  useEffect(() => {
    const fileList = multiple ? files : (file ? [file] : []);
    if (fileList && fileList.length) {
      Promise.all(fileList.map(f => new Promise(res => {
        const reader = new FileReader();
        reader.onload = e => res(e.target.result);
        reader.readAsDataURL(f);
      }))).then(setPreviews);
    } else {
      setPreviews([]);
    }
  }, [file, files, multiple]);

  return (
    <div style={{marginBottom:'1rem'}}>
      <label style={{fontSize:13,fontWeight:600,marginBottom:8,display:'block'}}>{label}</label>
      <div
        className={`upload-area ${dragging?'dragging':''}`}
        onDragOver={e=>{e.preventDefault();setDragging(true)}}
        onDragLeave={()=>setDragging(false)}
        onDrop={e=>{e.preventDefault();setDragging(false); const dt = e.dataTransfer; if(dt.files.length) { if(multiple) onChange(Array.from(dt.files)); else onChange(dt.files[0]); }}}
        onClick={()=>inputRef.current.click()}
      >
        <input ref={inputRef} type="file" accept={accept} multiple={multiple} onChange={handleFileSelect} style={{display:'none'}} />
        {previews.length ? (
          <div className="upload-preview" style={{justifyContent:'center'}}>
            {previews.map((src,i)=><img key={i} src={src} alt="" />)}
          </div>
        ) : (
          <div style={{color:C.muted}}>📁 Drag & drop or tap to upload</div>
        )}
      </div>
    </div>
  );
}

// ── DASHBOARD / CREDIT ENGINE / INVESTORS (same as before) ──
function AdminDashboard() {
  const [businesses, setBusinesses] = useState([]);
  const [loading, setLoading] = useState(true);
  const [searchQuery, setSearchQuery] = useState("");
  const [lastRefresh, setLastRefresh] = useState(null);

  const loadData = useCallback(async () => {
    try {
      const { data, error } = await supabaseClient
        .from("businesses")
        .select(`
          id, business_name, business_type, location, monthly_revenue,
          age_years, employee_count, has_bank_account, created_at,
          owners:owner_id(full_name, phone),
          credit_scores(*)
        `)
        .order("created_at", { ascending: false });
      if (error) throw error;
      setBusinesses(data || []);
      setLastRefresh(new Date().toLocaleTimeString("en-ZA"));
    } catch (err) { console.error("Failed to load:", err); }
    finally { setLoading(false); }
  }, []);

  useEffect(() => {
    loadData();
    const channel = supabaseClient.channel("admin-realtime")
      .on("postgres_changes", { event: "*", schema: "public", table: "businesses" }, () => loadData())
      .on("postgres_changes", { event: "*", schema: "public", table: "credit_scores" }, () => loadData())
      .subscribe();
    const interval = setInterval(loadData, 30000);
    return () => { supabaseClient.removeChannel(channel); clearInterval(interval); };
  }, [loadData]);

  const filtered = useMemo(() => {
    const q = searchQuery.toLowerCase();
    return businesses.filter(b => {
      const owner = b.owners;
      const latest = latestScore(b.credit_scores);
      return ((b.business_name||"").toLowerCase().includes(q) ||
              (b.location||"").toLowerCase().includes(q) ||
              (b.business_type||"").toLowerCase().includes(q) ||
              (owner?.full_name||"").toLowerCase().includes(q) ||
              (latest?.score?.toString()||"").includes(q));
    });
  }, [businesses, searchQuery]);

  const kpis = useMemo(() => {
    const total = businesses.length;
    const scores = businesses.map(b => latestScore(b.credit_scores)?.score).filter(Boolean);
    const avg = scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : null;
    const loanReady = scores.filter(s => s >= 700).length;
    const totalRev = businesses.reduce((sum,b)=> sum + (b.monthly_revenue||0), 0);
    return { total, avg, loanReady, totalRev };
  }, [businesses]);

  const scoreDistribution = useMemo(() => {
    const scores = businesses.map(b => latestScore(b.credit_scores)?.score).filter(Boolean);
    const tiers = [
      { label: "Excellent (750+)", count: scores.filter(s=>s>=750).length, color: C.green },
      { label: "Good (700–749)", count: scores.filter(s=>s>=700&&s<750).length, color: "#80C87A" },
      { label: "Fair (600–699)", count: scores.filter(s=>s>=600&&s<700).length, color: C.gold },
      { label: "Poor (<600)", count: scores.filter(s=>s<600).length, color: C.red },
    ];
    const max = Math.max(...tiers.map(t=>t.count), 1);
    return tiers.map(t => ({ ...t, widthPercent: (t.count/max)*100 }));
  }, [businesses]);

  const recent = useMemo(() => businesses.slice(0,5), [businesses]);

  return (
    <div style={{padding:'2rem',maxWidth:1200,margin:'0 auto'}}>
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'1rem',marginBottom:'1.5rem'}}>
        <div className="card"><div style={{fontSize:12,color:C.muted,marginBottom:4}}>Total SMEs</div><div className="kpi-val">{kpis.total||0}</div><div className="kpi-sub">onboarded</div></div>
        <div className="card"><div style={{fontSize:12,color:C.muted,marginBottom:4}}>Avg Credo Score</div><div className="kpi-val">{kpis.avg??"—"}</div><div className="kpi-sub">/ 850</div></div>
        <div className="card"><div style={{fontSize:12,color:C.muted,marginBottom:4}}>Loan-Ready (700+)</div><div className="kpi-val">{kpis.loanReady}</div><div className="kpi-sub">businesses</div></div>
        <div className="card"><div style={{fontSize:12,color:C.muted,marginBottom:4}}>Total Monthly Rev</div><div className="kpi-val">{formatCurrency(kpis.totalRev)}</div><div className="kpi-sub">across all SMEs</div></div>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 340px',gap:'1.5rem'}}>
        <div className="card" style={{padding:0,overflow:'hidden'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'1.25rem 1.5rem',borderBottom:`1px solid ${C.border}`}}>
            <div>
              <div style={{fontWeight:700,fontSize:15}}>SME Profiles</div>
              <div style={{fontSize:12,color:C.muted,marginTop:2}}>Latest credit score shown</div>
            </div>
            <input placeholder="Search..." value={searchQuery} onChange={e=>setSearchQuery(e.target.value)} style={{background:C.surface2,border:`1px solid ${C.border}`,color:C.text,padding:'7px 14px',borderRadius:8,fontSize:13,width:220}} />
          </div>
          {loading ? (
            <div className="empty-state" style={{padding:'3rem'}}><div className="spin" style={{width:32,height:32,borderRadius:'50%',border:`3px solid ${C.border}`,borderTopColor:C.green,margin:'0 auto 1rem'}}/><p>Loading...</p></div>
          ) : businesses.length === 0 ? (
            <div className="empty-state">
              <div style={{fontSize:'2.5rem',marginBottom:'1rem'}}>📭</div>
              <h3>No SMEs yet</h3>
              <p>When a business owner completes WhatsApp onboarding, their real profile appears here automatically.</p>
            </div>
          ) : (
            <table>
              <thead><tr><th>BUSINESS</th><th>TYPE</th><th>LOCATION</th><th>SCORE</th><th>REVENUE</th><th>STATUS</th><th>PROFILE</th><th>JOINED</th></tr></thead>
              <tbody>
                {filtered.map(b => {
                  const latest = latestScore(b.credit_scores);
                  const score = latest?.score ?? null;
                  const owner = b.owners;
                  const pct = score ? Math.round(((score - 300) / 550) * 100) : 0;
                  return (
                    <tr key={b.id}>
                      <td><div style={{fontWeight:600}}>{escapeHtml(b.business_name)}</div><div style={{fontSize:11,color:C.muted}}>{owner?.full_name || "—"}</div></td>
                      <td style={{color:C.muted}}>{b.business_type || "—"}</td>
                      <td style={{color:C.muted}}>{b.location || "—"}</td>
                      <td>{score ? <><div style={{fontWeight:800,color:scoreColor(score),fontSize:15}}>{score}</div><div className="score-bar-bg"><div className="score-bar" style={{width:`${pct}%`,background:scoreColor(score)}}/></div></> : <span style={{color:C.muted}}>Pending</span>}</td>
                      <td style={{color:C.text}}>{b.monthly_revenue ? formatCurrency(b.monthly_revenue) : "—"}</td>
                      <td><span className={`badge ${score>=700?'badge-green':score>=600?'badge-gold':'badge-red'}`}>{score>=700?'Loan Ready':score>=600?'Fair':'Building'}</span></td>
                      <td><div style={{display:'flex',flexWrap:'wrap',gap:4}}>{b.age_years && <span className="badge badge-blue">{b.age_years}y</span>}{b.employee_count && <span className="badge badge-blue">{b.employee_count} emp</span>}{b.has_bank_account ? <span className="badge badge-green">Banked</span> : <span className="badge badge-gold">No Bank</span>}</div></td>
                      <td style={{color:C.muted,fontSize:11}}>{new Date(b.created_at).toLocaleDateString("en-ZA")}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          )}
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:'1rem'}}>
          <div className="card">
            <div style={{fontSize:13,fontWeight:700,marginBottom:'1rem'}}>Score Distribution</div>
            {scoreDistribution.length ? scoreDistribution.map(t => (
              <div key={t.label} style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
                <div style={{width:8,height:8,borderRadius:'50%',background:t.color,flexShrink:0}}/>
                <div style={{flex:1,fontSize:12,color:C.muted}}>{t.label}</div>
                <div style={{width:60,height:5,background:C.border,borderRadius:3}}><div className="dist-bar" style={{width:`${t.widthPercent}%`,height:'100%',background:t.color,borderRadius:3}}/></div>
                <div style={{fontSize:13,fontWeight:700,color:t.color,width:20,textAlign:'right'}}>{t.count}</div>
              </div>
            )) : <div className="empty-state" style={{padding:'1rem 0'}}>No scores yet</div>}
          </div>
          <div className="card">
            <div style={{fontSize:13,fontWeight:700,marginBottom:'1rem'}}>Recent Onboardings</div>
            {recent.length ? recent.map(b => {
              const latest = latestScore(b.credit_scores);
              return (
                <div key={b.id} style={{display:'flex',justifyContent:'space-between',padding:'8px 0',borderBottom:`1px solid ${C.border}`}}>
                  <div><div style={{fontSize:13,fontWeight:600}}>{escapeHtml(b.business_name)}</div><div style={{fontSize:11,color:C.muted}}>{b.location||""}</div></div>
                  {latest?.score ? <div style={{fontWeight:800,color:scoreColor(latest.score)}}>{latest.score}</div> : <span style={{fontSize:11,color:C.muted}}>—</span>}
                </div>
              );
            }) : <div className="empty-state" style={{padding:'1rem 0'}}>Waiting...</div>}
          </div>
        </div>
      </div>
      <div style={{display:'flex',alignItems:'center',gap:8,marginTop:'1rem'}}>
        <span style={{width:7,height:7,borderRadius:'50%',background:C.green,animation:'pulse 2s infinite'}}/>
        <span style={{fontSize:12,color:C.muted}}>Live · {lastRefresh || '—'}</span>
      </div>
    </div>
  );
}

function CreditEngine() {
  const [inputs, setInputs] = useState({revenue:45000,txns:220,age:4,consistency:87,suppliers:12,digital:3});
  const [score, setScore] = useState(null);
  const [loading, setLoading] = useState(false);
  const fields = [
    {k:"revenue",l:"Monthly Revenue (ZAR)",min:1000,max:500000,step:1000,fmt:v=>`R${v.toLocaleString()}`},
    {k:"txns",l:"Monthly Transactions",min:1,max:1000,step:1,fmt:v=>v},
    {k:"age",l:"Business Age (years)",min:0,max:30,step:1,fmt:v=>`${v} yr${v!==1?'s':''}`},
    {k:"consistency",l:"Payment Consistency (%)",min:0,max:100,step:1,fmt:v=>`${v}%`},
    {k:"suppliers",l:"Supplier Relationships",min:0,max:100,step:1,fmt:v=>v},
    {k:"digital",l:"Digital Channels Active",min:0,max:10,step:1,fmt:v=>v},
  ];
  const calc = () => { setLoading(true); setTimeout(()=>{ const sc = Math.round(Math.min(300 + Math.min(inputs.revenue/500000,1)*200 + Math.min(inputs.txns/500,1)*150 + Math.min(inputs.age/10,1)*120 + (inputs.consistency/100)*200 + Math.min(inputs.suppliers/30,1)*100 + Math.min(inputs.digital/5,1)*80, 850)); setScore(sc); setLoading(false); }, 1400); };
  const sc = score;
  const scoreColorVal = !sc?C.muted:sc>=700?C.green:sc>=600?C.gold:C.red;
  const tier = !sc?'—':sc>=750?'Excellent':sc>=700?'Good':sc>=600?'Fair':'Poor';
  const loan = !sc?'—':sc>=700?'R500K–R2M':sc>=600?'R50K–R500K':'R10K–R50K';
  return (
    <div style={{padding:'2rem',maxWidth:980,margin:'0 auto'}}>
      <h2 style={{fontFamily:'DM Serif Display',Georgia,serif',fontSize:'1.8rem',fontWeight:400}}>Credit Intelligence Engine</h2>
      <p style={{color:C.muted,fontSize:14,marginBottom:'1.5rem'}}>Input SME behavioral data — Credo outputs a bankable credit profile</p>
      <div style={{display:'grid',gridTemplateColumns:'1fr 320px',gap:'1.5rem'}}>
        <div className="card" style={{padding:'2rem'}}>
          <div style={{fontSize:11,color:C.muted,letterSpacing:'0.1em',fontWeight:600,marginBottom:'1.5rem'}}>SME BEHAVIORAL DATA INPUTS</div>
          <div style={{display:'flex',flexDirection:'column',gap:'1.5rem'}}>
            {fields.map(f=>(
              <div key={f.k}>
                <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}><label style={{fontSize:13,fontWeight:500}}>{f.l}</label><span style={{fontSize:13,color:C.green,fontWeight:700}}>{f.fmt(inputs[f.k])}</span></div>
                <input type="range" min={f.min} max={f.max} step={f.step} value={inputs[f.k]} onChange={e=>setInputs(p=>({...p,[f.k]:+e.target.value}))}/>
              </div>
            ))}
          </div>
          <button onClick={calc} disabled={loading} style={{marginTop:'2rem',width:'100%',background:loading?C.surface2:C.green,color:loading?C.muted:'#000',border:'none',padding:14,borderRadius:10,fontWeight:700,fontSize:15,cursor:loading?'not-allowed':'pointer'}}>{loading?'Calculating…':'Generate Credo Score →'}</button>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:'1rem'}}>
          <div className="card" style={{padding:'2rem',textAlign:'center',flex:1}}>
            <div style={{fontSize:11,color:C.muted,letterSpacing:'0.1em',marginBottom:'1rem'}}>CREDO CREDIT SCORE</div>
            <div style={{fontSize:'5.5rem',fontFamily:'DM Serif Display',Georgia,serif',color:scoreColorVal,lineHeight:1}}>{sc??'—'}</div>
            <div style={{fontSize:'1rem',color:scoreColorVal,fontWeight:700,marginBottom:'1.5rem'}}>{tier}</div>
            <div style={{width:'100%',height:7,background:C.border,borderRadius:4}}><div style={{width:sc?`${((sc-300)/550)*100}%`:'0%',height:'100%',background:`linear-gradient(90deg,${C.red},${C.gold},${C.green})`,borderRadius:4}}/></div>
            {sc && <div style={{display:'flex',flexDirection:'column',gap:'0.75rem',textAlign:'left',marginTop:'1.5rem'}}>
              {[{l:"Loan Eligibility",v:loan},{l:"Risk Class",v:sc>=700?'Low Risk':sc>=600?'Medium Risk':'High Risk'},{l:"Insurance",v:sc>=600?'Eligible':'Conditional'},{l:"API Tier",v:sc>=700?'Premium':sc>=600?'Standard':'Basic'}].map(r=>
                <div key={r.l} style={{display:'flex',justifyContent:'space-between',padding:'8px 12px',background:C.surface2,borderRadius:8,fontSize:13}}><span style={{color:C.muted}}>{r.l}</span><span style={{fontWeight:700}}>{r.v}</span></div>
              )}
            </div>}
            {!sc && <div style={{color:C.muted,fontSize:13,padding:'2rem 0'}}>Adjust sliders and click Generate.</div>}
          </div>
          <div className="card">
            <div style={{fontSize:11,color:C.muted,fontWeight:600,marginBottom:10}}>SCORE SCALE</div>
            {[{r:"750–850",t:"Excellent",c:C.green},{r:"700–749",t:"Good",c:"#80C87A"},{r:"600–699",t:"Fair",c:C.gold},{r:"300–599",t:"Poor",c:C.red}].map(s=>
              <div key={s.r} style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}><div style={{width:7,height:7,borderRadius:'50%',background:s.c,flexShrink:0}}/><span style={{fontSize:12,flex:1,color:C.muted}}>{s.r}</span><span style={{fontSize:12,color:s.c,fontWeight:600}}>{s.t}</span></div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

      <div className="card" style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'2rem'}}>
        <div><div style={{fontWeight:700}}>Exit Strategy</div><div style={{fontSize:13,color:C.muted}}>Acquisition target for banks, telecoms, or global fintechs.</div></div>
        <div style={{textAlign:'right'}}><div style={{fontFamily:'DM Serif Display,Georgia,serif',fontSize:'2rem',color:C.green}}>Billions</div><div style={{fontSize:11,color:C.muted}}>ZAR valuation potential</div></div>
      </div>
    </div>
  );
}

// ── APP ─────────────────────────────────────
function App() {
  const [admin, setAdmin] = useState(isAdmin());
  const [showPin, setShowPin] = useState(false);
  const [pinInput, setPinInput] = useState("");
  const [pinError, setPinError] = useState(false);
  const [onboarding, setOnboarding] = useState(false);

  const handleLogin = () => {
    if (loginAdmin(pinInput)) {
      setAdmin(true);
      setShowPin(false);
      setPinError(false);
    } else {
      setPinError(true);
    }
  };

  if (onboarding) {
    return <VendorOnboarding onBackToLanding={()=>setOnboarding(false)} />;
  }

  if (!admin && !showPin) {
    return (
      <div>
        <PublicLanding onStartOnboarding={()=>setOnboarding(true)} />
        <div style={{position:'fixed',bottom:10,right:10,opacity:0.3,zIndex:9999}}>
          <a onClick={()=>setShowPin(true)} style={{color:C.muted,fontSize:10,cursor:'pointer',textDecoration:'none'}}>admin</a>
        </div>
      </div>
    );
  }

  if (!admin && showPin) {
    return (
      <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:'1rem',background:C.bg}}>
        <CredoLogo size={36} />
        <input type="password" placeholder="Enter PIN" value={pinInput} onChange={e=>setPinInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleLogin()} style={{background:C.surface2,border:`1px solid ${C.border}`,color:C.text,padding:'8px 16px',borderRadius:8,fontSize:15,width:200,textAlign:'center',outline:'none'}} />
        <button onClick={handleLogin} style={{background:C.green,color:'#000',border:'none',padding:'8px 24px',borderRadius:8,fontWeight:700,cursor:'pointer'}}>Log in</button>
        {pinError && <div style={{color:C.red,fontSize:12}}>Incorrect PIN</div>}
        <button onClick={()=>{setShowPin(false);setPinInput('');setPinError(false)}} style={{background:'transparent',color:C.muted,border:'none',cursor:'pointer',fontSize:12}}>Back to site</button>
      </div>
    );
  }

  return <AdminApp />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
